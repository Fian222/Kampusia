<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#183d39" />
    <title>Permintaan belum dapat diproses · Kampusia</title>
    <style>
      @font-face { font-family: 'Public Sans'; src: url('/fonts/public-sans-variable.ttf') format('truetype'); font-display: swap; }
      body { margin: 0; background: #f5f5ef; color: #183d39; font-family: 'Public Sans', system-ui, sans-serif; }
      main { max-width: 36rem; margin: 15vh auto; padding: 1.5rem; }
      h1 { font-size: 1.75rem; line-height: 1.3; }
      p { color: #4e5f56; line-height: 1.75; overflow-wrap: anywhere; }
      a { display: inline-flex; align-items: center; min-height: 2.75rem; margin-top: 1rem; padding: 0 1rem; border-radius: .5rem; background: #245d48; color: white; font-weight: 600; text-decoration: none; }
      a:hover { background: #224d3e; }
      a:focus-visible { outline: 2px solid #2e7054; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Permintaan belum dapat diproses</h1>
      <p role="alert">%sveltekit.error.message%</p>
      <p>Kode %sveltekit.status%. Silakan coba lagi atau kembali ke ruang kerja.</p>
      <a href="/">Kembali ke ruang kerja</a>
    </main>
  </body>
</html>
